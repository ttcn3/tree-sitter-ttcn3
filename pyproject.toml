[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-ttcn3"
description = "TTCN-3 grammar for tree-sitter"
version = "0.2.1"
keywords = ["incremental", "parsing", "tree-sitter", "ttcn3"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [
  {name = "Matthias Simon"},
  {name = "Jerry Wang", email = "z.wang@ymail.com"},
]
requires-python = ">=3.10"
license.text = "MIT"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/ttcn3/tree-sitter-ttcn3"

[project.optional-dependencies]
core = ["tree-sitter~=0.25"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
