[package]
name = "tree-sitter-ttcn3"
description = "TTCN-3 grammar for tree-sitter"
version = "0.2.1"
authors = ["Matthias Simon", "Jerry Wang <z.wang@ymail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "ttcn3"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/ttcn3/tree-sitter-ttcn3"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.11"
